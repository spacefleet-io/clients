apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// The Google-free build (SF_FOSS=1, PLAT-MOBILE-06): the F-Droid build and the APK published for phones without Google
// Play services. It links no Firebase, Cast or ML Kit (packages/mobile-shell/foss.cjs) and takes its Cast-free
// sources from src/foss; unset, the build is the Play build with src/play.
def fossBuild = System.getenv("SF_FOSS") == "1"
// Metro reads the switch too; as a task input it rebuilds the JS bundle when a checkout changes between the two builds.
tasks.matching { it.name ==~ /createBundle.*JsAndAssets/ }.configureEach { inputs.property("sfFoss", fossBuild) }
// Apply google-services only when google-services.json is present so dev
// builds without a Firebase project still compile. CI provisions the real
// file from a secret before invoking gradle.
if (!fossBuild && file('google-services.json').exists()) {
    apply plugin: "com.google.gms.google-services"
}

def buildToolsVersionValue = "37.0.0"
def minSdkVersionValue = 26
def compileSdkVersionValue = 37
def targetSdkVersionValue = 36
def ndkVersionValue = rootProject.ext.ndkVersion

ext {
    REACT_NATIVE_NODE_MODULES_DIR = file("$rootDir/../node_modules/react-native").canonicalPath
    REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = file("$rootDir/../node_modules/react-native-worklets").canonicalPath
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    reactNativeDir = file("$rootDir/../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    codegenDir = file("$rootDir/../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    cliFile = file("$rootDir/../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   bun's isolated node_modules layout hides `hermes-compiler` from the
    //   plugin's default lookup, so resolve it from react-native's real location.
    //   Only bundled variants (release/profile) run hermesc.
    hermesCommand = providers.exec {
        commandLine("node", "--print",
            "require('path').join(require('path').dirname(require.resolve('hermes-compiler/package.json', { paths: [require('path').dirname(require.resolve('react-native/package.json'))] })), 'hermesc', '%OS-BIN%', 'hermesc')")
        workingDir(rootDir)
    }.standardOutput.asText.get().trim()
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Play upload key (Play App Signing: Google holds the app signing key, we sign uploads with this one). Read from a
// gradle property or the environment, never committed; the release workflow and the local backup
// (~/.local/share/spacefleet-keys/badger-upload.*) use the same names. Debug and profile builds keep the debug key;
// a release build without the upload key fails (see the taskGraph check below) instead of shipping debug-signed.
def releaseSetting = { String name -> (findProperty(name) ?: System.getenv(name))?.toString()?.trim() ?: null }
def uploadStoreFile = releaseSetting("BADGER_UPLOAD_STORE_FILE")
def uploadStorePassword = releaseSetting("BADGER_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = releaseSetting("BADGER_UPLOAD_KEY_ALIAS") ?: "badger-upload"
def uploadKeyPassword = releaseSetting("BADGER_UPLOAD_KEY_PASSWORD") ?: uploadStorePassword
def uploadKeyMissing = [
    uploadStoreFile == null ? "BADGER_UPLOAD_STORE_FILE" : (file(uploadStoreFile).isFile() ? null : "BADGER_UPLOAD_STORE_FILE (no file at ${uploadStoreFile})"),
    uploadStorePassword == null ? "BADGER_UPLOAD_STORE_PASSWORD" : null,
].findAll { it != null }

// Store version (REL-CD-12, `badger-android-v*`): the release workflow passes -PbadgerVersionCode (monotonic, from
// the run number) and -PbadgerVersionName (from the tag). Local builds keep 1 / "1.0".
def badgerVersionCode = (releaseSetting("badgerVersionCode") ?: "1")
if (!(badgerVersionCode ==~ /[1-9][0-9]{0,9}/) || badgerVersionCode.toLong() > 2100000000L) {
    throw new GradleException("badgerVersionCode must be an integer from 1 to 2100000000, got '${badgerVersionCode}'")
}
def badgerVersionName = releaseSetting("badgerVersionName") ?: "1.0"

android {
    ndkVersion ndkVersionValue
    buildToolsVersion buildToolsVersionValue
    compileSdk compileSdkVersionValue

    namespace "com.spacebadger.mobile"
    sourceSets {
        main {
            java.srcDirs += fossBuild ? "src/foss/java" : "src/play/java"
            // The NDK libc++ committed beside the app's sources is a prebuilt binary, which F-Droid's build refuses; the
            // Google-free build takes the same NDK r27b libc++ from the media-deps bundle (@space/mobile-mpv-playback).
            if (fossBuild) jniLibs.srcDirs = []
        }
        // ChunkListCodecTest reads the shared packed chunk list vectors (LIB-FMT-11) straight from the definition package.
        test {
            resources.srcDirs += "../../../../../packages/library-db-definition/test-vectors"
        }
    }
    defaultConfig {
        applicationId "com.spacebadger.mobile"
        // `-PsfApplicationIdSuffix=.e2e`: a test build installed next to the real app, never over it (REL-TEST-10).
        applicationIdSuffix((findProperty("sfApplicationIdSuffix") ?: "").toString())
        minSdkVersion minSdkVersionValue
        targetSdkVersion targetSdkVersionValue
        versionCode badgerVersionCode.toInteger()
        versionName badgerVersionName
        // Release policy (res/xml/network_security_config.xml): cleartext only to the on-device playback proxy.
        manifestPlaceholders = [usesCleartextTraffic: "false", networkSecurityConfig: "@xml/network_security_config"]
        // The sister app named in <queries> (ACCT-PAIR-07) carries the same test suffix.
        manifestPlaceholders += [sfApplicationIdSuffix: (findProperty("sfApplicationIdSuffix") ?: "").toString()]
        ndk {
            // Every Android ABI by default (gradle.properties, PLAT-TV-05); `-PreactNativeArchitectures=x86_64`
            // builds only for the x86_64 phone and Google TV emulators, with libmpv from `fetch-deps.ts --target android-x64`.
            abiFilters(*findProperty("reactNativeArchitectures").toString().split(","))
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (uploadKeyMissing.isEmpty()) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true", networkSecurityConfig: "@xml/network_security_config_dev"]
        }
        release {
            // The Play upload key; null when it is not configured, and then any release task fails below.
            signingConfig uploadKeyMissing.isEmpty() ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false", networkSecurityConfig: "@xml/network_security_config"]
        }
        // Bundled, optimised JS (no Metro) + the debug player probe, signed
        // with the debug key so it upgrades an installed debug build in place.
        // Used for phone performance runs and for the unplugged test install
        // (cleartext allowed: the dev stack is plain http on the LAN).
        profile {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
            manifestPlaceholders = [usesCleartextTraffic: "true", networkSecurityConfig: "@xml/network_security_config_dev"]
        }
    }
}

// SF_DEV_TICKET_KEY=1 makes the bundled JS pin the committed dev ticket key (babel-plugin-dev-ticket-key.js,
// META-ANON-06). It is for a profile build made for dev-stack testing only; a release build must pin production.
gradle.taskGraph.whenReady { graph ->
    def releaseTasks = graph.allTasks.findAll { it.project == project && it.name.toLowerCase().contains("release") }
    if (System.getenv("SF_DEV_TICKET_KEY")?.trim() == "1" && !releaseTasks.isEmpty()) {
        throw new GradleException("SF_DEV_TICKET_KEY=1 is for dev-testing profile builds only; unset it for a release build")
    }
    // A release artifact is only ever signed with the Play upload key: no silent debug-signed fallback. The Google-free
    // build is signed with it when it is set, and is otherwise left unsigned for F-Droid to sign.
    if (!fossBuild && !uploadKeyMissing.isEmpty() && releaseTasks.any { it.name ==~ /(assemble|bundle|package|sign|install)Release.*/ }) {
        throw new GradleException("Release build needs the Play upload key; missing: ${uploadKeyMissing.join(', ')}. " +
            "Set them as gradle properties or env (see ~/.local/share/spacefleet-keys/badger-upload.README.md), " +
            "or build the debug/profile variant instead.")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // libmpv comes from the autolinked @space/mobile-mpv-playback workspace
    // package: its jniLibs are our own packages/media-deps android bundle
    // (vendor/deps/android-<arch>, `bun scripts/fetch-deps.ts --target android-arm64`)
    // and is.xyz.mpv.MPVLib is Kotlin source in that package.
    // Google Cast (UX-TV-03): MainActivity creates the CastContext, so the Cast SDK must be on the app's own classpath
    // (react-native-google-cast declares it `implementation`). Keep the version equal to castFrameworkVersion in
    // android/build.gradle (the root project is not configured yet when this file is evaluated). The Google-free
    // build has no Cast.
    if (!fossBuild) {
        implementation("com.google.android.gms:play-services-cast-framework:22.3.1")
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // JVM unit tests (src/test): pure-Kotlin code such as library.SnapshotCodec, run on the build host.
    testImplementation("junit:junit:4.13.2")
    // android.jar's org.json is a stub on the JVM ("Method ... not mocked"); the real one parses the test vectors.
    testImplementation("org.json:json:20260814")
}
