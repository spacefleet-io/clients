org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true

# Every Android ABI, the one list for the Play build and the Google-free (F-Droid) build alike: an APK installed
# outside Play must start on 32-bit and x86 devices too (the arm64-only foss APK crashed on an x86_64 device, run
# 15344). One ABI for a quick local build: ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
# Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false

# Monorepo node_modules location.
REACT_NATIVE_NODE_MODULES_DIR=../node_modules/react-native

