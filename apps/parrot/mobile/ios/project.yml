# Source of Parrot.xcodeproj (XcodeGen 2.46). After editing: `xcodegen generate && pod install` on the Mac
# (README-ios.md); `pod install` adds the CocoaPods build phases to the generated project.
name: Parrot
options:
  deploymentTarget:
    iOS: "15.1"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "iPhone Developer"
    ENABLE_STRICT_OBJC_MSGSEND: YES
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": ""
    GCC_C_LANGUAGE_STANDARD: gnu99
    GCC_NO_COMMON_BLOCKS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "15.1"
    LD_RUNPATH_SEARCH_PATHS: ["/usr/lib/swift", "$(inherited)"]
    LIBRARY_SEARCH_PATHS: ['"$(SDKROOT)/usr/lib/swift"', '"$(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME)"', '"$(inherited)"']
    OTHER_CFLAGS: ["$(inherited)", "-DRCT_REMOVE_LEGACY_ARCH=1"]
    OTHER_CPLUSPLUSFLAGS:
      - "$(OTHER_CFLAGS)"
      - "-DFOLLY_NO_CONFIG"
      - "-DFOLLY_MOBILE=1"
      - "-DFOLLY_USE_LIBCPP=1"
      - "-DFOLLY_CFG_NO_COROUTINES=1"
      - "-DFOLLY_HAVE_CLOCK_GETTIME=1"
      - "-DRCT_REMOVE_LEGACY_ARCH=1"
    REACT_NATIVE_PATH: "${PODS_ROOT}/../../node_modules/react-native"
    SDKROOT: iphoneos
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    USE_HERMES: true
  configs:
    Debug:
      COPY_PHASE_STRIP: NO
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      MTL_ENABLE_DEBUG_INFO: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    Release:
      COPY_PHASE_STRIP: YES
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      VALIDATE_PRODUCT: YES
targets:
  Parrot:
    type: application
    platform: iOS
    sources:
      - path: Parrot
        excludes:
          - "*.entitlements"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ACCT-PAIR-06: Universal Links for the pairing QR on a device.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Parrot/Parrot-Device.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Parrot/Parrot-Simulator.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 8766H6KW4V
        ENABLE_BITCODE: NO
        # React Native's bundle phase sources .xcode.env and runs node outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Parrot/Info.plist
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        MARKETING_VERSION: "0.1.0"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-lc++"]
        PRODUCT_NAME: Parrot
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        VERSIONING_SYSTEM: apple-generic
      configs:
        # A Debug build installs next to the TestFlight app (its own bundle id and name), never over it.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.spacefleet.parrot.debug
          PARROT_DISPLAY_NAME: Parrot Dev
          PARROT_ALLOW_CLEARTEXT: YES
          # ACCT-PAIR-07: same-device sign-in links (Info.plist); Debug talks to Debug, never to the TestFlight app.
          SF_SIBLING_URL_SCHEME: parrot-dev
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.spacefleet.parrot
          PARROT_DISPLAY_NAME: Parrot
          PARROT_ALLOW_CLEARTEXT: NO
          SF_SIBLING_URL_SCHEME: parrot
    postCompileScripts:
      - name: Bundle React Native code and images
        inputFiles:
          - $(SRCROOT)/.xcode.env.local
          - $(SRCROOT)/.xcode.env
        basedOnDependencyAnalysis: false
        script: |
          set -e

          WITH_ENVIRONMENT="$REACT_NATIVE_PATH/scripts/xcode/with-environment.sh"
          REACT_NATIVE_XCODE="$REACT_NATIVE_PATH/scripts/react-native-xcode.sh"

          /bin/sh -c "\"$WITH_ENVIRONMENT\" \"$REACT_NATIVE_XCODE\""
    postBuildScripts:
      - name: Configure App Transport Security
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
        script: |
          # Mirrors Android's dev network security config: plain-HTTP API hosts (a dev stack on another machine) only work
          # in builds with PARROT_ALLOW_CLEARTEXT=YES (Debug by default; pass it on xcodebuild for a Release build that
          # talks to a dev stack).
          INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ "${PARROT_ALLOW_CLEARTEXT}" = "YES" ]; then
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$INFO_PLIST" || true
          fi
  # Apple TV (PAR-TV-01): the same JS app (index.js registers "Parrot", the TV branch picks the TV screens) and the same
  # AppDelegate on react-native-tvos. Built from its own ParrotTV scheme only: the Parrot scheme (iPhone TestFlight, UI
  # tests) never builds it.
  ParrotTV:
    type: application
    platform: tvOS
    deploymentTarget: "15.1"
    sources:
      - path: Parrot/AppDelegate.swift
      - path: ParrotTV
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 8766H6KW4V
        ENABLE_BITCODE: NO
        # React Native's bundle phase sources .xcode.env and runs node outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: ParrotTV/Info.plist
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        MARKETING_VERSION: "0.1.0"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-lc++"]
        PRODUCT_NAME: ParrotTV
        SDKROOT: appletvos
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        TVOS_DEPLOYMENT_TARGET: "15.1"
        VERSIONING_SYSTEM: apple-generic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.spacefleet.parrot.debug
          PARROT_DISPLAY_NAME: Parrot Dev
          PARROT_ALLOW_CLEARTEXT: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.spacefleet.parrot
          PARROT_DISPLAY_NAME: Parrot
          PARROT_ALLOW_CLEARTEXT: NO
    postCompileScripts:
      - name: Bundle React Native code and images
        inputFiles:
          - $(SRCROOT)/.xcode.env.local
          - $(SRCROOT)/.xcode.env
        basedOnDependencyAnalysis: false
        script: |
          set -e

          WITH_ENVIRONMENT="$REACT_NATIVE_PATH/scripts/xcode/with-environment.sh"
          REACT_NATIVE_XCODE="$REACT_NATIVE_PATH/scripts/react-native-xcode.sh"

          /bin/sh -c "\"$WITH_ENVIRONMENT\" \"$REACT_NATIVE_XCODE\""
    postBuildScripts:
      - name: Configure App Transport Security
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
        script: |
          # Same as the Parrot target: plain-HTTP dev stacks only in builds with PARROT_ALLOW_CLEARTEXT=YES.
          INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ "${PARROT_ALLOW_CLEARTEXT}" = "YES" ]; then
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$INFO_PLIST" || true
          fi
  # Plain XCTests, no app host, no pods: the playback logic of the AudioPlayback pod (limiter, up-next order) and the
  # same-device sign-in rules of the SiblingSignIn pod (ACCT-PAIR-07).
  ParrotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../../../packages/mobile-audio-playback/ios/AudioPlayback/Core
      - path: ../../../../packages/mobile-audio-playback/ios/Tests
      - path: ../../../../packages/mobile-sibling/ios/SiblingSignIn/Core
      - path: ../../../../packages/mobile-sibling/ios/Tests
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8766H6KW4V
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.spacefleet.parrot.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
  # Functional tests through the app's UI, against a dev stack (how to run them: ../README-ios.md).
  ParrotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParrotUITests
    dependencies:
      - target: Parrot
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8766H6KW4V
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.spacefleet.parrot.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Parrot
  # The Apple TV app's UI tests: today only the release smoke's new-account pairing (REL-TEST-36), run by
  # scripts/release-smoke/ios.ts --device tv against a dev-stack lane before TestFlight.
  ParrotTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "15.1"
    sources:
      - path: ParrotTVUITests
    dependencies:
      - target: ParrotTV
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8766H6KW4V
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.spacefleet.parrot.tvuitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: ParrotTV
schemes:
  Parrot:
    build:
      targets:
        Parrot: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ParrotTests
        - ParrotUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Apple TV app (PAR-TV-01). apple-testflight-build.sh archives and uploads it after the iPhone app (REL-MOB-04).
  ParrotTV:
    build:
      targets:
        ParrotTV: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Release smoke (REL-TEST-36): `xcodebuild build-for-testing` of the Release app for the simulator plus its UI tests,
  # built by the release smoke build script before the TestFlight archive; scripts/release-smoke/ios.ts runs
  # only the smoke test of the bundle (-only-testing). Release, so the tested app is the configuration users get.
  ParrotReleaseSmoke:
    build:
      targets:
        Parrot: all
        ParrotUITests: [test]
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - ParrotUITests
  ParrotTVReleaseSmoke:
    build:
      targets:
        ParrotTV: all
        ParrotTVUITests: [test]
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - ParrotTVUITests
