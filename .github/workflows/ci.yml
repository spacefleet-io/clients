name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The media suites run the real tools from the shipped media-deps bundle (FFmpeg 8, ffprobe, mpv), as the
      # private CI does: Ubuntu's own ffmpeg is older and decodes differently. The bundle comes from the public
      # spacefleet-io/media-deps releases with this workflow's own token; luajit and xvfb serve the mpv script and
      # window tests.
      - name: Media bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends luajit xvfb xauth
          bun scripts/fetch-deps.ts --target linux-x64
          bin="$PWD/vendor/deps/linux-x64/bin"
          if ldd "$bin/mpv" "$bin/ffmpeg" "$bin/ffprobe" | grep -q 'not found'; then
            sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libdrm2 libx11-6 libx11-xcb1 libxcb1 libxcb-dri3-0 libxext6 libxfixes3 libxrandr2 libxrender1 libexpat1 zlib1g libstdc++6 libgcc-s1 libasound2t64 libglib2.0-0t64 libdbus-1-3 libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0
          fi
          if ldd "$bin/mpv" "$bin/ffmpeg" "$bin/ffprobe" | grep 'not found'; then exit 1; fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/ffmpeg" -version | sed -n 1p
      # The unit tests minus .github/known-failing-tests.txt: files that also fail upstream. A missing
      # media tool fails its suite instead of skipping it.
      - run: bun .github/scripts/ci-test.ts
        env:
          SF_REQUIRE_MEDIA_BINARIES: "1"

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/badger/desktop build
      - run: bun run --cwd apps/parrot/desktop build
